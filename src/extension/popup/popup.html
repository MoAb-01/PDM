<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #18181b;
      color: #f1f5f9;
    }
    .header {
      background: #1e1e24;
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-size: 12.5px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #0284c7;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: bold;
    }
    .list {
      padding: 8px 12px;
      max-height: 260px;
      overflow-y: auto;
    }
    .item {
      background: #23232a;
      border: 1px solid #383842;
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .item-url {
      color: #94a3b8;
      font-family: monospace;
      font-size: 10px;
      word-break: break-all;
      margin: 3px 0;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      border: none;
      color: #fff;
      padding: 5px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }
    .btn:hover {
      background: #0369a1;
    }
    .empty {
      padding: 24px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>IDM Media Sniffer</span>
    </div>
    <div class="badge" id="count-badge">0 Found</div>
  </div>
  <div class="list" id="media-list">
    <div class="empty">No media streams detected on this tab yet. Play a video to sniff.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
